name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: Check Rust formatting and lints
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Run the Rust tests
        shell: bash
        run: cargo test --locked
      - name: Build the Rust tools
        shell: bash
        run: cargo build --release --locked
      - name: Install .NET for the assembly reader
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Run the Python tests, with the Rust tools required
        shell: bash
        env:
          PHOBOS_REQUIRE_NATIVE: "1"
        run: |
          ${{ matrix.python }} --version
          ${{ matrix.python }} -W error::DeprecationWarning -m unittest discover -s tests -v
