name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the Python tests
        shell: bash
        run: |
          ${{ matrix.python }} --version
          ${{ matrix.python }} -W error::DeprecationWarning -m unittest discover -s tests -v
